name: TradeReach Instagram

on:
  schedule:
    - cron: '7,37 * * * *' # every 30 min; GitHub may run scheduled jobs a few minutes late
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no posting, no commits)'
        type: boolean
        default: true

concurrency: { group: social, cancel-in-progress: false } # never two publishers at once

permissions:
  contents: write # commit queue, media and state; take and delete claude/inbox-* branches

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }} # emergency stop: set the repo variable to anything but "true"
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
      CHROME_PATH: /usr/bin/google-chrome
      FFMPEG_PATH: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - name: Anything to do?
        id: work
        run: |
          if [ -f STOP ] || { [ "$PUBLISHING_ENABLED" != "true" ] && [ "$DRY_RUN" != "1" ]; }; then
            echo "Stopped (STOP file or PUBLISHING_ENABLED is not true)."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install FFmpeg and emoji font
        if: steps.work.outputs.go == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null

      - name: Collect drafts from the daily Claude task
        if: steps.work.outputs.go == 'true' && env.DRY_RUN != '1'
        run: |
          # Only inbox/ is taken from Claude's branches, so drafts can never change code or settings.
          git fetch -q origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' || exit 0
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/claude/); do
            git checkout "$b" -- inbox/ 2>/dev/null && echo "took drafts from $b" || echo "no drafts in $b"
            git push -q origin --delete "${b#origin/}" || true
          done

      - name: Build posts from drafts (claim check, repeat check, render)
        if: steps.work.outputs.go == 'true'
        continue-on-error: ${{ inputs.dry_run == true }}
        run: node src/prepare.mjs

      - name: Render the approved samples (dry run only)
        if: env.DRY_RUN == '1'
        run: node src/render.mjs content/samples/*.json

      - name: Publish due posts
        if: steps.work.outputs.go == 'true'
        run: node src/publish.mjs

      - name: Collect insights
        if: steps.work.outputs.go == 'true' && always()
        run: node src/insights.mjs

      - name: Keep dry-run renders for review
        if: always() && env.DRY_RUN == '1'
        uses: actions/upload-artifact@v5
        with:
          name: dry-run-renders
          path: |
            out/**/*.mp4
            media/**/*.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state
        if: always() && steps.work.outputs.go == 'true' && env.DRY_RUN != '1'
        run: |
          git config user.name "tradereach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in queue media state inbox; do if [ -e "$d" ]; then git add -A "$d"; fi; done
          git diff --cached --quiet && exit 0
          git commit -qm "social: state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
